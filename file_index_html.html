<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Site Builder Pro</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/preview.css">
</head>
<body>
    <div class="container">
        <div class="editor">
            <iframe id="previewFrame"></iframe>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>Photo Site Builder Pro</h2>
                <div class="button-group">
                    <button class="btn-save" id="saveBtn">💾 Salva</button>
                    <button class="btn-load" id="loadBtn">📤 Carica</button>
                    <input id="loadInput" type="file" accept=".json" />
                    <button class="btn-export" id="exportBtn">📥 Esporta Sito</button>
                </div>
                <div class="tabs" id="tabsContainer"></div>
            </div>

            <div class="panel-content">
                <div id="pages" class="section active"></div>
                <div id="editor" class="section"></div>
                <div id="header" class="section"></div>
                <div id="settings" class="section"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
